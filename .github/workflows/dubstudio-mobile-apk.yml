name: Build DubStudio KH Pro Mobile APK
on:
  push:
    branches: [dubstudio-kh-pro-mobile-apk]
    paths:
      - 'dubstudio-mobile/**'
      - '.github/workflows/dubstudio-mobile-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "SDK manager unavailable"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: dubstudio-mobile
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DubStudio-KH-Pro-Mobile-APK
          path: dubstudio-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
