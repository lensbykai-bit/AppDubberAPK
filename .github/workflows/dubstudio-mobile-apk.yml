name: Build DubStudio KH Pro Mobile APK
on:
  push:
    branches: [dubstudio-kh-pro-mobile-apk]
    paths:
      - 'dubstudio-mobile/**'
      - '.github/workflows/dubstudio-mobile-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: dubstudio-mobile
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DubStudio-KH-Pro-Mobile-APK
          path: dubstudio-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
