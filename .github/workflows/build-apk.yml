name: Build DubStudio KH Pro Android APK
on:
  push:
    branches: ['main', 'dubstudio-kh-pro-mobile', 'dubstudio-kh-pro-cloud']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DubStudio-KH-Pro-Cloud-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
