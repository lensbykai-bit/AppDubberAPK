services:
  api:
    build:
      context: .
      args:
        WITH_DIARIZATION: ${WITH_DIARIZATION:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      DUBSTUDIO_DATA_DIR: /srv/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jobs:/srv/data
      - whisper_models:/root/.cache/huggingface
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
volumes:
  jobs: {}
  whisper_models: {}
  ollama_models: {}
